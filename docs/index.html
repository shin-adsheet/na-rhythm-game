<style>
:root { --bg: #ffffff; --fg: #1e293b; --accent: #ec4899; --sun: #fcd34d; --sky: #bae6fd; color-scheme: light; }
html, body, #root { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); overflow: hidden; }

      html, body, #root { height: 100%; margin: 0; }
      * { -webkit-tap-highlight-color: transparent; }
      body {
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        font-family: 'Mochiy Pop One', sans-serif;
        overflow: hidden;
      }

      /* Polka Dot Background
         水玉は ::before に描いて transform で動かす（background-position を動かすと毎コマ画面全体を描き直すので重い） */
      .bg-polka, .bg-fever { background-color: #ffffff; isolation: isolate; }
      .bg-fever { background-color: #fff1f8; }
      .bg-polka::before, .bg-fever::before {
        content: ''; position: absolute; left: -100px; top: -100px; right: 0; bottom: 0; pointer-events: none;
        background-image: radial-gradient(#e5e7eb 20%, transparent 20%), radial-gradient(#e5e7eb 20%, transparent 20%);
        background-position: 0 0, 50px 50px;
        background-size: 100px 100px;
        animation: scroll-bg 20s linear infinite;
        will-change: transform; z-index: -1;
      }
      /* フィーバー中の背景 */
      .bg-fever::before {
        background-image: radial-gradient(#fbcfe8 20%, transparent 20%), radial-gradient(#fde68a 20%, transparent 20%);
        animation-duration: 2s;
      }
      .fever-glow { overflow: hidden; mix-blend-mode: multiply; }
      .fever-glow::before {
        content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 400%;
        background: linear-gradient(120deg, rgba(251,191,36,0.25), rgba(244,114,182,0.25), rgba(56,189,248,0.25), rgba(251,191,36,0.25), rgba(244,114,182,0.25), rgba(56,189,248,0.25), rgba(251,191,36,0.25));
        animation: fever-glow 2s linear infinite;
        will-change: transform;
      }
      @keyframes fever-glow {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      @keyframes fever-hue {
        0% { filter: hue-rotate(0deg); }
        100% { filter: hue-rotate(360deg); }
      }

      @keyframes scroll-bg {
        0% { transform: translate(0, 0); }
        100% { transform: translate(100px, 100px); }
      }

      /* ===== 「な」のアニメーション ===== */
      @keyframes fall {
        0% { transform: translateY(-100%) rotate(-30deg) scale(1); opacity: 1; }
        100% { transform: translateY(110vh) rotate(30deg) scale(1.5); opacity: 0; }
      }
      .animate-fall { animation: fall 5s linear forwards; }

      @keyframes na-float {
        0% { transform: translateY(0) scale(0.6) rotate(0deg); opacity: 0; }
        15% { opacity: 1; }
        100% { transform: translateY(-120vh) scale(1.3) rotate(15deg); opacity: 0; }
      }
      .na-float { animation: na-float var(--dur, 3s) ease-out forwards; }

      @keyframes na-spin {
        0% { transform: translateY(-20vh) rotate(0deg) scale(0.8); opacity: 1; }
        100% { transform: translateY(110vh) rotate(1080deg) scale(1.2); opacity: 0; }
      }
      .na-spin { animation: na-spin var(--dur, 3s) linear forwards; }

      @keyframes na-bounce {
        0% { transform: translateY(-40vh) scaleX(1) scaleY(1); }
        30% { transform: translateY(0) scaleX(1.3) scaleY(0.6); }
        45% { transform: translateY(-25vh) scaleX(0.9) scaleY(1.2); }
        60% { transform: translateY(0) scaleX(1.2) scaleY(0.7); }
        72% { transform: translateY(-12vh) scaleX(1) scaleY(1.05); }
        82% { transform: translateY(0) scaleX(1.1) scaleY(0.85); }
        100% { transform: translateY(0) scale(1); opacity: 0; }
      }
      .na-bounce { animation: na-bounce var(--dur, 1.6s) cubic-bezier(0.3, 0, 0.6, 1) forwards; transform-origin: bottom center; }

      @keyframes na-zigzag {
        0% { transform: translate(0, -20vh) rotate(-15deg); opacity: 1; }
        25% { transform: translate(15vw, 15vh) rotate(15deg); }
        50% { transform: translate(-15vw, 45vh) rotate(-15deg); }
        75% { transform: translate(15vw, 75vh) rotate(15deg); }
        100% { transform: translate(-10vw, 110vh) rotate(-15deg); opacity: 0; }
      }
      .na-zigzag { animation: na-zigzag var(--dur, 3s) ease-in-out forwards; }

      @keyframes na-pop {
        0% { transform: scale(0) rotate(-20deg); opacity: 0; }
        40% { transform: scale(1.4) rotate(5deg); opacity: 1; }
        60% { transform: scale(1) rotate(0deg); }
        100% { transform: scale(1.2) rotate(0deg); opacity: 0; }
      }
      .na-pop { animation: na-pop var(--dur, 0.9s) cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

      @keyframes na-wave {
        0% { transform: translate(0, 0) rotate(-10deg); opacity: 1; }
        25% { transform: translate(30vw, -12vh) rotate(10deg); }
        50% { transform: translate(60vw, 0) rotate(-10deg); }
        75% { transform: translate(90vw, 12vh) rotate(10deg); }
        100% { transform: translate(130vw, 0) rotate(-10deg); opacity: 0.6; }
      }
      .na-wave { animation: na-wave var(--dur, 3.5s) ease-in-out forwards; }

      @keyframes na-slide-l {
        0% { transform: translateX(0) skewX(30deg); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateX(130vw) skewX(-30deg); opacity: 1; }
      }
      @keyframes na-slide-r {
        0% { transform: translateX(0) skewX(-30deg); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateX(-130vw) skewX(30deg); opacity: 1; }
      }
      .na-slide-l { animation: na-slide-l var(--dur, 0.8s) cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      .na-slide-r { animation: na-slide-r var(--dur, 0.8s) cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

      @keyframes na-rainbow {
        0% { transform: translateY(-20vh) rotate(-10deg); filter: hue-rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(10deg); filter: hue-rotate(720deg); opacity: 0; }
      }
      .na-rainbow {
        animation: na-rainbow var(--dur, 3.5s) linear forwards;
        background: linear-gradient(90deg, #f43f5e, #f59e0b, #22c55e, #06b6d4, #8b5cf6, #f43f5e);
        -webkit-background-clip: text; background-clip: text; color: transparent !important;
        -webkit-text-stroke: 0 !important;
      }

      @keyframes na-giant {
        0% { transform: translateY(-120%) scale(0.5) rotate(-5deg); opacity: 0; }
        20% { transform: translateY(10vh) scale(1.1) rotate(2deg); opacity: 1; }
        30% { transform: translateY(0) scale(1) rotate(0deg); }
        70% { transform: translateY(5vh) scale(1) rotate(0deg); opacity: 1; }
        100% { transform: translateY(120vh) scale(1.5) rotate(10deg); opacity: 0; }
      }
      .na-giant { animation: na-giant var(--dur, 4s) cubic-bezier(0.3, 0, 0.5, 1) forwards; }

      @keyframes na-ring {
        0% { transform: rotate(var(--angle)) translateX(0) rotate(calc(-1 * var(--angle))) scale(0); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: rotate(calc(var(--angle) + 540deg)) translateX(45vmin) rotate(calc(-1 * var(--angle) - 540deg)) scale(1.2); opacity: 0; }
      }
      .na-ring { animation: na-ring var(--dur, 2.4s) ease-out forwards; }

      @keyframes na-shadow {
        0% { transform: translateX(-40vw) scale(1.4); opacity: 0; }
        30% { opacity: 0.6; }
        100% { transform: translateX(40vw) scale(0.6); opacity: 0; }
      }
      .na-shadow { animation: na-shadow var(--dur, 1.2s) ease-out forwards; }

      @keyframes na-neon {
        0%, 100% { opacity: 0; }
        10%, 30%, 50%, 70% { opacity: 1; text-shadow: 0 0 10px #f0f, 0 0 20px #f0f, 0 0 40px #f0f, 0 0 80px #0ff; }
        20%, 40%, 60% { opacity: 0.2; text-shadow: none; }
        80% { opacity: 1; transform: scale(1.3); }
      }
      .na-neon { animation: na-neon var(--dur, 2s) linear forwards; color: #fff !important; -webkit-text-stroke: 2px #f0f !important; }

      @keyframes na-gold {
        0% { transform: translateY(-20vh) rotate(-5deg) scale(0.8); opacity: 0; }
        10% { opacity: 1; transform: translateY(0) scale(1.1); }
        20% { transform: translateY(3vh) rotate(5deg) scale(1); }
        40% { transform: translateY(20vh) rotate(-8deg) scale(1.1); }
        60% { transform: translateY(38vh) rotate(8deg) scale(1); }
        80% { transform: translateY(56vh) rotate(-5deg) scale(1.1); }
        100% { transform: translateY(110vh) rotate(0deg) scale(0.8); opacity: 0; }
      }
      @keyframes gold-glow {
        0%, 100% { filter: drop-shadow(0 0 6px #fbbf24) brightness(1); }
        50% { filter: drop-shadow(0 0 24px #f59e0b) brightness(1.3); }
      }
      .na-gold {
        animation: na-gold var(--dur, 7s) ease-in-out forwards, gold-glow 0.6s ease-in-out infinite;
        color: #fde047 !important; -webkit-text-stroke: 3px #b45309 !important;
        cursor: pointer; pointer-events: auto !important;
      }
      .na-diamond {
        animation: na-gold var(--dur, 9s) ease-in-out forwards, gold-glow 0.4s ease-in-out infinite, fever-hue 1.5s linear infinite;
        color: #a5f3fc !important; -webkit-text-stroke: 3px #0e7490 !important;
        cursor: pointer; pointer-events: auto !important;
      }

      @keyframes na-chain {
        0% { transform: translateX(0) scaleX(0.3); opacity: 0; }
        15% { transform: translateX(10vw) scaleX(1.5); opacity: 1; }
        100% { transform: translateX(140vw) scaleX(1); opacity: 1; }
      }
      .na-chain { animation: na-chain var(--dur, 2.2s) cubic-bezier(0.1, 0.9, 0.3, 1) forwards; white-space: nowrap; }

      @keyframes na-thunder {
        0% { transform: translateY(-120%) scaleY(3); opacity: 0; }
        8% { transform: translateY(20vh) scaleY(0.6); opacity: 1; }
        12% { transform: translateY(18vh) scaleY(1.1); }
        20%, 60% { transform: translateY(20vh) scaleY(1); opacity: 1; }
        100% { transform: translateY(20vh) scale(2); opacity: 0; }
      }
      .na-thunder { animation: na-thunder var(--dur, 0.7s) ease-out forwards; color: #fef08a !important; -webkit-text-stroke: 3px #eab308 !important; text-shadow: 0 0 30px #fde047, 0 0 60px #fff; }
      @keyframes flash-white {
        0% { opacity: 0.9; } 100% { opacity: 0; }
      }
      .flash-white { animation: flash-white 0.5s ease-out forwards; }

      @keyframes na-flip {
        0% { transform: perspective(600px) rotateY(0deg) rotateX(0deg) scale(0.5); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: perspective(600px) rotateY(1080deg) rotateX(360deg) scale(1.4); opacity: 0; }
      }
      .na-flip { animation: na-flip var(--dur, 2s) ease-in-out forwards; }

      @keyframes na-blackhole {
        0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) rotate(720deg) scale(0); opacity: 0; }
      }
      .na-blackhole { animation: na-blackhole var(--dur, 1.8s) cubic-bezier(0.6, 0, 1, 0.4) forwards; }

      @keyframes na-pixel {
        0% { transform: translateY(-20vh); opacity: 1; }
        100% { transform: translateY(110vh); opacity: 1; }
      }
      .na-pixel { animation: na-pixel var(--dur, 3s) steps(12, end) forwards; image-rendering: pixelated; font-family: monospace !important; text-shadow: 4px 4px 0 #000; }

      @keyframes na-tsunami {
        0% { transform: translateX(0) rotate(0deg); opacity: 1; }
        100% { transform: translateX(-150vw) rotate(-20deg); opacity: 1; }
      }
      .na-tsunami { animation: na-tsunami var(--dur, 2.4s) cubic-bezier(0.2, 0.7, 0.3, 1) forwards; color: #67e8f9 !important; -webkit-text-stroke: 3px #0891b2 !important; }

      @keyframes na-invert-text {
        0% { transform: scale(0) rotate(0deg); opacity: 0; }
        20% { transform: scale(1.3) rotate(180deg); opacity: 1; }
        80% { transform: scale(1) rotate(180deg); opacity: 1; }
        100% { transform: scale(2) rotate(180deg); opacity: 0; }
      }
      .na-invert { animation: na-invert-text var(--dur, 2.5s) ease-out forwards; color: #111 !important; -webkit-text-stroke: 3px #fff !important; }
      @keyframes world-invert {
        0% { filter: invert(0) ; transform: rotate(0deg); }
        15% { filter: invert(1); transform: rotate(180deg); }
        85% { filter: invert(1); transform: rotate(180deg); }
        100% { filter: invert(0); transform: rotate(360deg); }
      }
      .world-invert { animation: world-invert 2.5s ease-in-out forwards; }

      @keyframes na-matrix {
        0% { transform: translateY(-100%); opacity: 1; }
        100% { transform: translateY(110vh); opacity: 0.8; }
      }
      .na-matrix { animation: na-matrix var(--dur, 3s) linear forwards; color: #4ade80 !important; -webkit-text-stroke: 0 !important; text-shadow: 0 0 8px #22c55e; white-space: pre; line-height: 1; font-family: monospace !important; }

      /* ===== ヒット時のポップ文字 ===== */
      @keyframes hit-word {
        0% { transform: translate(-50%, 0) scale(0.3) rotate(-10deg); opacity: 0; }
        30% { transform: translate(-50%, -40px) scale(1.2) rotate(3deg); opacity: 1; }
        100% { transform: translate(-50%, -120px) scale(1) rotate(0deg); opacity: 0; }
      }
      .hit-word { animation: hit-word 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      @keyframes score-pop {
        0% { transform: translateY(0) scale(0.5); opacity: 0; }
        20% { transform: translateY(-10px) scale(1.2); opacity: 1; }
        100% { transform: translateY(-80px) scale(1); opacity: 0; }
      }
      .score-pop { animation: score-pop 1s ease-out forwards; }

      /* ===== できごとカットイン（イージングで、じっくり見せる） ===== */
      .ci-wrap { animation: ci-exit 0.45s cubic-bezier(0.7, 0, 0.84, 0) calc(var(--dur) - 0.45s) forwards; }
      @keyframes ci-exit { to { transform: translateX(-30%) skewX(8deg); opacity: 0; } }
      .ci-band { animation: ci-band 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes ci-band {
        0% { clip-path: inset(0 100% 0 0); transform: translateX(14%) skewY(-2deg); }
        100% { clip-path: inset(0 0 0 0); transform: translateX(0) skewY(-2deg); }
      }
      .ci-char { animation: ci-char 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both; animation-delay: calc(0.28s + var(--i) * 55ms); }
      @keyframes ci-char {
        0% { transform: translateY(60%) scale(0.2) rotate(-14deg); opacity: 0; }
        70% { opacity: 1; }
        100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
      }
      .ci-tag { animation: ci-up 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both; }
      .ci-sub { animation: ci-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both; }
      @keyframes ci-up { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .ci-prop { animation: ci-prop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both; }
      @keyframes ci-prop { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
      .ci-shield { animation: ci-shield 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s both; }
      @keyframes ci-shield {
        0% { transform: perspective(400px) rotateY(-540deg) scale(0.3); opacity: 0; }
        100% { transform: perspective(400px) rotateY(0) scale(1); opacity: 1; }
      }
      .ci-stamp { animation: stamp-in 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) 1.25s both; }
      .ci-float { animation: ci-float 1.4s ease-in-out infinite; }
      @keyframes ci-float { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-10px) rotate(8deg); } }
      .ci-press { animation: ci-press 0.18s steps(2) infinite; }
      @keyframes ci-press { 50% { opacity: 0.35; } }
      .ci-spin-in { animation: ci-spin 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      @keyframes ci-spin { from { transform: rotate(-180deg) scale(0); } to { transform: rotate(0) scale(1); } }
      .ci-wave { animation: ci-wave 1.2s ease-in-out infinite; }
      @keyframes ci-wave { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
      .ci-penlight { animation: ci-pen 0.34s ease-in-out infinite alternate; }
      @keyframes ci-pen { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
      .ci-orbit { animation: ci-orbit 3s linear infinite; }
      @keyframes ci-orbit { to { transform: rotate(360deg); } }
      .ci-flame { animation: ci-flame 0.28s ease-in-out infinite alternate; }
      @keyframes ci-flame { from { transform: scaleY(0.75); } to { transform: scaleY(1.2); } }
      .ci-hammer { animation: ci-hammer 0.7s cubic-bezier(0.7, 0, 0.84, 0) 0.45s both; }
      @keyframes ci-hammer {
        0% { transform: rotate(-70deg); }
        70% { transform: rotate(18deg); }
        85% { transform: rotate(8deg); }
        100% { transform: rotate(14deg); }
      }
      .ci-scan { background: repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 5px); animation: ci-scan 0.6s linear infinite; }
      @keyframes ci-scan { to { background-position: 0 10px; } }

      /* ===== special「な」 ===== */
      .special-fly { animation: special-fly var(--dur, 5s) cubic-bezier(0.37, 0, 0.63, 1) forwards, special-spin 2.4s linear infinite; }
      @keyframes special-fly {
        0% { transform: translateX(0) translateY(0); }
        25% { transform: translateX(-32vw) translateY(-26px); }
        50% { transform: translateX(-62vw) translateY(14px); }
        75% { transform: translateX(-90vw) translateY(-18px); }
        100% { transform: translateX(-125vw) translateY(0); }
      }
      @keyframes special-spin { to { filter: hue-rotate(360deg); } }
      .item-in { animation: item-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      @keyframes item-in { from { transform: translate(-50%, -24px) scale(0.6); opacity: 0; } to { transform: translate(-50%, 0) scale(1); opacity: 1; } }
      .item-bar { animation: item-bar linear forwards; transform-origin: left; }
      @keyframes item-bar { from { transform: scaleX(1); } to { transform: scaleX(0); } }

      /* ===== 判定の文字 ===== */
      .judge-pop { animation: judge-pop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) forwards; }
      @keyframes judge-pop {
        0% { transform: translateY(10px) scale(0.6); opacity: 0; }
        30% { transform: translateY(0) scale(1.12); opacity: 1; }
        100% { transform: translateY(-8px) scale(1); opacity: 0; }
      }
      .rules-in { animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .bubble-in { animation: bubble-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      @keyframes bubble-in { from { transform: translate(-50%, 10px) scale(0.6); opacity: 0; } to { transform: translate(-50%, 0) scale(1); opacity: 1; } }
      /* 炎上の結果（大炎上・鎮火） */
      .burnfx-wrap { animation: burnfx-wrap 1.7s ease-out forwards; }
      @keyframes burnfx-wrap { 0% { opacity: 0; } 8% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
      .burnfx-red { background: radial-gradient(ellipse at 50% 120%, rgba(220,38,38,0.65), rgba(127,29,29,0.35) 55%, transparent 80%); }
      .burnfx-flame { animation: burnfx-flame 1.7s cubic-bezier(.2,.9,.3,1) both; }
      @keyframes burnfx-flame { 0% { transform: translateY(60%) scaleY(0.3); } 25% { transform: translateY(0) scaleY(1.15); } 40% { transform: scaleY(0.92) skewX(4deg); } 55% { transform: scaleY(1.08) skewX(-5deg); } 70% { transform: scaleY(0.95) skewX(3deg); } 100% { transform: translateY(30%) scaleY(0.6); } }
      .burnfx-drop { animation: burnfx-drop 0.9s cubic-bezier(.5,0,.9,.6) both; }
      @keyframes burnfx-drop { 0% { transform: translateY(-40px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(100vh); opacity: 0.8; } }
      .burnfx-text { animation: burnfx-text 1.7s cubic-bezier(.34,1.56,.64,1) both; }
